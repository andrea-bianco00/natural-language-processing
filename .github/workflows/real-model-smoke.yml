name: Real pretrained model smoke test

on:
  workflow_dispatch:

jobs:
  distilbert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create non-restricted synthetic examples
        run: python tests/create_smoke_data.py
      - name: Run pretrained DistilBERT forward, backward and evaluation
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python run_experiment.py \
            --model distilbert \
            --data outputs/synthetic_smoke_data.json \
            --epochs 1 \
            --batch-size 2 \
            --max-train-samples 2 \
            --max-valid-samples 2 \
            --max-test-samples 2 \
            --output outputs/distilbert_smoke.json
      - name: Verify JSON results
        run: |
          python -c "import json; r=json.load(open('outputs/distilbert_smoke.json')); assert r['model']=='distilbert'; assert r['epochs']==1; assert 0<=r['test_entities']['f1']<=1; print('Real-model smoke test completed')"
