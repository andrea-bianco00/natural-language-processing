name: Python tests and notebook validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<3" "torch>=2.1,<3" "nbformat>=5,<6"
      - name: Check Python syntax
        run: python -m compileall -q src tests run_experiment.py compare_results.py
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Colab notebook structure and syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import nbformat
          path = Path("notebooks/ENSAI_NER_Colab_Reproduction.ipynb")
          nb = nbformat.read(path, as_version=4)
          nbformat.validate(nb)
          for index, cell in enumerate(nb.cells, 1):
              if cell.cell_type == "code":
                  ast.parse(cell.source, filename=f"{path}:cell-{index}")
                  assert not cell.outputs, "Committed notebook has execution outputs"
          print(f"Validated {len(nb.cells)} notebook cells")
          PY
      - name: Audit tracked files before public release
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          paths = sorted(path for path in paths if path)
          forbidden_names = {
              "project.zip", "conll03-iob-pos.json", "conll03-iob-pos.json.gz",
              ".env", ".env.local", ".env.production", "id_rsa", "id_ed25519",
          }
          forbidden_suffixes = (".pt", ".pth", ".ckpt", ".safetensors", ".pem", ".key")
          forbidden_dirs = ("data/raw/", "data/processed/", "checkpoints/", "outputs/", "wandb/")
          violations = []
          print(f"Tracked files: {len(paths)}")
          for path in paths:
              normalized = path.lower().replace("\\", "/")
              size = pathlib.Path(path).stat().st_size
              print(f"{path} ({size} bytes)")
              name = pathlib.PurePosixPath(normalized).name
              if (
                  name in forbidden_names
                  or normalized.endswith(forbidden_suffixes)
                  or any(normalized.startswith(prefix) for prefix in forbidden_dirs)
              ):
                  violations.append(path)
          if violations:
              print("Restricted or sensitive tracked paths:", *violations, sep="\n - ", file=sys.stderr)
              sys.exit(1)
          print("Tracked-file path audit passed. This does not replace manual content review.")
          PY
